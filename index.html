<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonWitch OSINT - Payment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050305;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border-color: rgba(255, 255, 255, 0.05);
            --accent: #d92671;
            --accent-glow: #ff3385;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top center, rgba(217, 38, 113, 0.1), transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .header svg { stroke: var(--accent); width: 24px; height: 24px; }
        .header h1 { font-size: 1.25rem; letter-spacing: 2px; text-transform: uppercase; }
        .header span { color: var(--accent); }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        .scanner-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .scanner-img-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .scanner-glow {
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, var(--accent), #9333ea);
            border-radius: 20px;
            filter: blur(15px);
            opacity: 0.3;
        }

        .scanner-img {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            object-fit: cover;
        }

        .content-section { padding: 2rem; }
        .title { font-size: 1.8rem; text-align: center; margin-bottom: 0.5rem; }
        .desc { color: var(--accent); text-align: center; font-weight: 500; margin-bottom: 1.5rem; }
        
        .instructions {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .instructions ol {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            padding-left: 1rem;
        }

        .instructions li::marker { color: var(--accent); }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(217, 38, 113, 0.2);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--accent), #9333ea);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 1rem;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .success-state {
            display: none;
            text-align: center;
            padding: 3rem 2rem;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: #4ade80;
        }

        .success-icon svg { width: 40px; height: 40px; }
        .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 0.5rem; display: none; text-align: center;}

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <h1>MoonWitch<span>.OSINT</span></h1>
    </div>

    <div class="glass-card" id="payment-card">
        <div class="scanner-section">
            <div class="scanner-img-wrapper">
                <div class="scanner-glow"></div>
                <img src="/scanner.png" alt="QR Code" class="scanner-img" onerror="this.src='https://via.placeholder.com/200/111/d92671?text=QR+Code'">
            </div>
            <p style="color: rgba(255,255,255,0.8); font-size: 0.95rem;">Scan the QR Code to Complete Payment</p>
        </div>

        <div class="content-section">
            <h2 class="title" id="page-title">Loading...</h2>
            <p class="desc" id="page-desc"></p>

            <div class="instructions">
                <ol id="instructions-list"></ol>
            </div>

            <form id="payment-form">
                <div class="form-group">
                    <label>MoonWitch Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Agent ID" required>
                </div>
                <div class="form-group">
                    <label>UTR / Transaction Number</label>
                    <input type="text" id="utr" class="form-control" placeholder="12-digit UTR" minlength="10" required>
                </div>
                <div class="error-msg" id="error-message"></div>
                <button type="submit" class="btn" id="submit-btn">Payment Done</button>
            </form>
        </div>
    </div>

    <!-- Success Screen -->
    <div class="glass-card success-state" id="success-card">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Payment Submitted Successfully</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.6;">
            Your payment request has been sent successfully.<br><br>
            Once our team verifies your payment, your request will be processed and added to your MoonWitch account. No further action is required.
        </p>
    </div>

    <script>
        // Configuration for different routes
        const plans = {
            'credits': {
                title: 'Purchase Credits',
                desc: '20 Credits = ₹50',
                type: 'Credits',
                instructions: [
                    'Scan the QR code above.', 'Pay exactly ₹50.',
                    'Enter your MoonWitch username and the UTR below.', 'Click "Payment Done".',
                    'Credits will be added after manual verification.'
                ]
            },
            'weekly': {
                title: 'Weekly Subscription', desc: '', type: 'Weekly',
                instructions: ['Scan the QR code.', 'Pay the Weekly amount.', 'Enter username and UTR.', 'Click Payment Done.', 'Subscription activates after verification.']
            },
            'monthly': {
                title: 'Monthly Subscription', desc: '', type: 'Monthly',
                instructions: ['Scan the QR code.', 'Pay the Monthly amount.', 'Enter username and UTR.', 'Click Payment Done.', 'Subscription activates after verification.']
            },
            'lifetime': {
                title: 'Lifetime Membership', desc: '', type: 'Lifetime',
                instructions: ['Scan the QR code.', 'Pay the Lifetime amount.', 'Enter username and UTR.', 'Click Payment Done.', 'Access activates after verification.']
            }
        };

        // Determine current plan from URL
        let path = window.location.pathname.replace('/', '').toLowerCase();
        if (!plans[path]) path = 'credits'; // Default fallback
        const currentPlan = plans[path];

        // Populate HTML with plan data
        document.getElementById('page-title').innerText = currentPlan.title;
        const descEl = document.getElementById('page-desc');
        if(currentPlan.desc) { descEl.innerText = currentPlan.desc; } else { descEl.style.display = 'none'; }
        
        const listEl = document.getElementById('instructions-list');
        currentPlan.instructions.forEach(inst => {
            const li = document.createElement('li');
            li.innerText = inst;
            listEl.appendChild(li);
        });

        // Form Submission Logic
        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorEl = document.getElementById('error-message');
            const username = document.getElementById('username').value;
            const utr = document.getElementById('utr').value;

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.innerText = 'Processing...';

            try {
                const response = await fetch('/api/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        planType: currentPlan.type, 
                        username: username, 
                        utr: utr 
                    })
                });

                if (!response.ok) throw new Error('Submission failed.');
                
                document.getElementById('payment-card').style.display = 'none';
                document.getElementById('success-card').style.display = 'block';
            } catch (error) {
                errorEl.innerText = 'Something went wrong. Please try again.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Payment Done';
            }
        });
    </script>
</body>
</html>
